# Emma release pipeline — CI green + tag => installer published as a GitHub
# Release, and the app's auto-updater picks it up via the stable
# "releases/latest/download" base URL (config/endpoint.global.json cdnBaseUrl).
#
# Flow:
#   1. push tag v*.*.* (or manual dispatch with a version)
#   2. build installers per platform (NSIS win / zip mac / AppImage+deb linux)
#   3. generate manifest-<platform>-<arch>.json (version + sha256 + size)
#   4. create/replace the GitHub Release with installers + manifests as assets
#
# The desktop updater then fetches:
#   https://github.com/<org>/<repo>/releases/latest/download/manifest-<platform>-<arch>.json
# and offers the installer when app.version > installed version.

name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (x.y.z)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: '--max-old-space-size=8192'
  # Miroir public des binaires d'agents (claude/codex/ripgrep) utilisé en
  # fallback quand l'API GitHub est rate-limitée sur les runners. Emma ne
  # héberge pas encore ces binaires sur ses propres Releases.
  XDT_CDN_BASE_URL: 'https://hotfix.cindy.app/cindy'

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ver="${{ github.event.inputs.version }}"
          else
            ver="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${ver}"

  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        shell: bash
        run: |
          # The runner's cached pnpm store can be left inconsistent by a
          # cancelled/interrupted run (ENOENT on rename into node_modules);
          # clear the store once and retry before failing the job.
          if ! pnpm install --frozen-lockfile; then
            echo "pnpm install failed - clearing store cache and retrying"
            rm -rf "$(pnpm store path)" node_modules
            pnpm install --frozen-lockfile
          fi

      # cc-manager/anthropic-compat-proxy/remote-file-service/device-link-relay/
      # pi-manager are gitignored and staged by this script (esbuild bundles).
      # `electron-forge make` does NOT trigger npm pre hooks, so external
      # pipelines must call it explicitly — without it, packaging fails with
      # ENOENT on resources/cc-manager.
      - name: Build remote bundles
        working-directory: apps/desktop
        run: pnpm build:remote-bundles

      # package.json stays at the 0.0.0 versionless sentinel (package-args test);
      # forge.config.ts injects appVersion from APP_VERSION.
      - name: Build NSIS installer
        working-directory: apps/desktop
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: node scripts/forge-cli.mjs make --platform=win32 --arch=x64

      - name: Normalize artifact name (no spaces)
        shell: pwsh
        run: |
          $v = "${{ needs.resolve-version.outputs.version }}"
          $src = Get-ChildItem "apps/desktop/out/make/nsis" -Recurse -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not $src) { throw "No NSIS installer found in apps/desktop/out/make/nsis" }
          Copy-Item $src.FullName "emma-setup-${v}.exe"
          Get-FileHash "emma-setup-${v}.exe" -Algorithm SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: win32-x64
          path: emma-setup-*.exe

  build-macos:
    needs: resolve-version
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          # The runner's cached pnpm store can be left inconsistent by a
          # cancelled/interrupted run (ENOENT on rename into node_modules);
          # clear the store once and retry before failing the job.
          if ! pnpm install --frozen-lockfile; then
            echo "pnpm install failed - clearing store cache and retrying"
            rm -rf "$(pnpm store path)" node_modules
            pnpm install --frozen-lockfile
          fi

      - name: Build remote bundles
        working-directory: apps/desktop
        run: pnpm build:remote-bundles

      - name: Build macOS app
        working-directory: apps/desktop
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: node scripts/forge-cli.mjs make --platform=darwin --arch=arm64

      - name: Package zip
        run: |
          v="${{ needs.resolve-version.outputs.version }}"
          # MakerZIP (forge make) produit deja le zip distribuable:
          # out/make/zip/darwin/arm64/<name>-<version>.zip contenant Emma.app.
          # On le renomme simplement; re-zipper depuis out/package etait
          # fragile (le .app nu n'y est pas toujours present selon la version
          # de forge).
          set +e
          zipfile=$(find apps/desktop/out/make -type f -name "*.zip" -path "*darwin*" 2>/dev/null | head -1)
          if [ -z "$zipfile" ]; then
            echo "No darwin zip under out/make; listing out/ for diagnosis:"
            find apps/desktop/out -maxdepth 4 \( -name "*.app" -o -name "*.zip" \) 2>/dev/null | head -20
            exit 1
          fi
          cp "$zipfile" "emma-mac-${v}.zip"
          shasum -a 256 "emma-mac-${v}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: darwin-arm64
          path: emma-mac-*.zip

  build-linux:
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          # The runner's cached pnpm store can be left inconsistent by a
          # cancelled/interrupted run (ENOENT on rename into node_modules);
          # clear the store once and retry before failing the job.
          if ! pnpm install --frozen-lockfile; then
            echo "pnpm install failed - clearing store cache and retrying"
            rm -rf "$(pnpm store path)" node_modules
            pnpm install --frozen-lockfile
          fi

      # wayland-scanner is required by the native remote-desktop tools
      # (linux-input build.mjs); not present on the stock ubuntu runner.
      - name: Install Wayland build deps
        # Outils Wayland (wayland-scanner) + libs natifs remote-desktop:
        # input (xkbcommon/json-c/x11/xtst), capture (libturbojpeg/libpng).
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libjson-c-dev \
            libx11-dev libxtst-dev libturbojpeg0-dev libpng-dev

      - name: Build remote bundles
        working-directory: apps/desktop
        run: pnpm build:remote-bundles

      - name: Build Linux packages
        working-directory: apps/desktop
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: node scripts/forge-cli.mjs make --platform=linux --arch=x64

      - name: Collect artifacts
        run: |
          v="${{ needs.resolve-version.outputs.version }}"
          mkdir -p dist-linux
          find apps/desktop/out/make -maxdepth 3 \( -name "*.AppImage" -o -name "*.deb" \) -exec cp {} dist-linux/ \;
          ls -la dist-linux/

      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: linux-x64
          path: dist-linux/

  release:
    needs: [resolve-version, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    # +staging des binaires d'agents (~1 Go de téléchargements + archimage multi-plateformes).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        shell: bash
        run: |
          # stage-agent-binaries.mjs importe tar/unzipper (deps workspace).
          if ! pnpm install --frozen-lockfile; then
            echo "pnpm install failed - clearing store cache and retrying"
            rm -rf "$(pnpm store path)" node_modules
            pnpm install --frozen-lockfile
          fi

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Fetch pinned agent binaries
        shell: bash
        env:
          # The fetchers hit the GitHub release API for codex/ripgrep; the token
          # raises the rate limit from 60/h (anonymous) to the authenticated quota.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # tools/<tool>/updates/<version>/<platform>/ is NOT tracked in git: it is
          # produced by these fetchers (official sources, sha256-verified, fail-closed).
          # The pinned version MUST be passed as an argument: with no version, update.mjs
          # compares upstream latest to the committed latest.json and exits WITHOUT
          # downloading when they already match — which is the normal state of a
          # pinned release, so staging would then find no sources.
          for tool in claude codex-package ripgrep; do
            v=$(node -p "require('./tools/$tool/latest.json').version")
            echo "[fetch] $tool $v — all platforms"
            node "tools/$tool/update.mjs" "$v"
          done
          # pi is fetched by stage-agent-binaries.mjs itself (pinned URL in
          # tools/pi/latest.json; its win32 asset is a .zip handled by unzipper,
          # since GNU tar on Linux cannot extract zip).
          ls -R tools/claude/updates tools/codex-package/updates tools/ripgrep/updates

      - name: Stage agent binaries
        run: |
          mkdir -p staged
          node scripts/stage-agent-binaries.mjs --platform win32-x64 --out staged/win32-x64
          node scripts/stage-agent-binaries.mjs --platform darwin-arm64 --out staged/darwin-arm64
          node scripts/stage-agent-binaries.mjs --platform linux-x64 --out staged/linux-x64
          ls -laR staged

      - name: Generate update manifests
        run: |
          v="${{ needs.resolve-version.outputs.version }}"
          mkdir -p manifests
          node scripts/generate-update-manifest.mjs --version "$v" --platform win32-x64 \
            --installer "artifacts/win32-x64/emma-setup-${v}.exe" --agent-binaries staged/win32-x64 --out manifests/manifest-win32-x64.json
          node scripts/generate-update-manifest.mjs --version "$v" --platform darwin-arm64 \
            --installer "artifacts/darwin-arm64/emma-mac-${v}.zip" --agent-binaries staged/darwin-arm64 --out manifests/manifest-darwin-arm64.json
          # Linux: prefer AppImage, fall back to deb
          linux_asset=$(ls artifacts/linux-x64/*.AppImage 2>/dev/null | head -1)
          [ -z "$linux_asset" ] && linux_asset=$(ls artifacts/linux-x64/*.deb 2>/dev/null | head -1)
          if [ -n "$linux_asset" ]; then
            node scripts/generate-update-manifest.mjs --version "$v" --platform linux-x64 \
              --installer "$linux_asset" --agent-binaries staged/linux-x64 --out manifests/manifest-linux-x64.json
          else
            echo "No Linux asset; skipping linux manifest"
          fi
          # endpoint.json: the app fetches {cdnBaseUrl}/endpoint.json at startup to
          # refresh its endpoint configuration (clientEndpointResilience.ts).
          cp config/endpoint.global.json manifests/endpoint.json
          cat manifests/*.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.resolve-version.outputs.version }}"
          tag="v${v}"
          assets="artifacts/win32-x64/emma-setup-${v}.exe"
          [ -f "artifacts/darwin-arm64/emma-mac-${v}.zip" ] && assets="$assets artifacts/darwin-arm64/emma-mac-${v}.zip"
          for f in artifacts/linux-x64/*; do [ -f "$f" ] && assets="$assets $f"; done
          # Assets vendor de binaires d'agents (noms plats que l'updater télécharge au démarrage).
          for p in win32-x64 darwin-arm64 linux-x64; do
            for f in staged/$p/*.gz staged/$p/*.tar.gz; do [ -f "$f" ] && assets="$assets $f"; done
          done
          for f in manifests/manifest-*.json; do assets="$assets $f"; done
          assets="$assets manifests/endpoint.json"

          # Créer la release SANS assets puis uploader séparément: `gh release
          # create <assets>` race avec uploads.github.com (HTTP 404 sur l'asset
          # juste après la création de la release, problème GitHub connu).
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Emma $v" \
              --notes "Emma $v — auto-updatable release. Installers and update manifests for all platforms."
            sleep 10
          fi
          # Retry loop: les uploads peuvent 404/transitoirement échouer juste
          # après la création.
          attempt=1
          until gh release upload "$tag" $assets --clobber; do
            if [ "$attempt" -ge 3 ]; then
              echo "Asset upload failed after 3 attempts"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "Upload attempt $((attempt - 1)) failed, retrying in 15s..."
            sleep 15
          done
          echo "Published https://github.com/${{ github.repository }}/releases/tag/$tag"
